<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thank You | Above All Media</title>
<meta name="description" content="Thanks for contacting Above All Media. Your inquiry has been received.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#070807">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/lux/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070807;--ink:#f4eddd;--muted:rgba(244,237,221,.72);--gold-l:#ead2a0;--gold-grad:linear-gradient(100deg,#f6e6c0 0%,#d9b77d 34%,#a9824a 64%,#efd7a6 100%);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;padding:32px 20px;font:400 16px/1.7 Inter,system-ui,sans-serif;color:var(--ink);position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:url(/assets/lux/harbour-fly.webp) center/cover;opacity:.38}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(7,8,7,.55),#070807 85%)}
main{width:min(680px,100%);animation:in 1.2s var(--ease) both}
.k{display:inline-flex;align-items:center;gap:12px;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-l)}
.k::before{content:"";width:28px;height:1px;background:var(--gold-l)}
h1{margin:22px 0 22px;font:400 clamp(44px,8vw,84px)/1 'Cormorant Garamond',serif;letter-spacing:-.01em}
h1 em{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
p{max-width:52ch;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font:500 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:transform .5s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.gold{background:var(--gold-grad);color:#120d05}
.line{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(244,237,221,.35)}
:focus-visible{outline:1px solid var(--gold-l);outline-offset:4px}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <span class="k">Inquiry received</span>
  <h1>Thank you. <em>We&rsquo;ll be in touch.</em></h1>
  <p>Your project details are with us. We&rsquo;ll review them with your goals in mind and come back with a clear next step. If it&rsquo;s urgent, call or text (803) 920-5349.</p>
  <div class="actions">
    <a class="btn gold" href="/">Return home</a>
    <a class="btn line" href="/#work">View the work</a>
  </div>
</main>
</body>
</html>
