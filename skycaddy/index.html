<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyCaddy | Above All Media</title>
<meta name="description" content="SkyCaddy by Above All Media: a cinematic flyover of Hole 10 at Palmetto Dunes, Hilton Head Island.">
<link rel="canonical" href="https://aboveallmediasc.com/skycaddy/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;600&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7f2e8;--muted:rgba(247,242,232,.8);--brass:#ffd592;--bg:#020508;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.stage{position:fixed;inset:0;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,8,.7),transparent 26%,transparent 66%,rgba(2,5,8,.85))}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(16px,env(safe-area-inset-top)) 20px 16px}
.brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:14px;border:1px solid rgba(247,242,232,.22);background:rgba(2,5,8,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--brass)}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:20px 20px max(20px,env(safe-area-inset-bottom))}
.info .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.info h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(26px,4vw,44px);letter-spacing:-.04em;line-height:1.05;margin:6px 0}
.info p{color:var(--muted);font-size:15px;max-width:460px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;min-height:48px;padding:12px 20px;border-radius:14px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:#140a02;background:linear-gradient(115deg,#ffe3a8,#ffb561 45%,#ff8450 80%,#ff6a55)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(247,242,232,.12)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe3a8,#ff6a55)}
:focus-visible{outline:2px solid #7ff0e0;outline-offset:3px;border-radius:8px}
@media (max-width:600px){.actions{width:100%}.actions>*{flex:1;justify-content:center}}
</style>
</head>
<body>
<main class="stage">
  <video id="fly" src="flyover.mp4" poster="flyover-poster.jpg" autoplay muted playsinline loop preload="auto"></video>
  <div class="shade"></div>
  <header class="top">
    <a class="brand" href="../">SkyCaddy<small>by Above All Media</small></a>
    <div class="actions">
      <button class="pill" id="sound" type="button" aria-pressed="false">&#128264; Sound on</button>
      <a class="pill" href="../#capabilities">&larr; Back to website</a>
    </div>
  </header>
  <section class="bottom">
    <div class="info">
      <div class="tag">Course preview &middot; Hilton Head Island, SC</div>
      <h1>Hole 10 &middot; Palmetto Dunes</h1>
      <p>Fly the hole from tee to green before you ever pick up a club. The full interactive course is on its way.</p>
    </div>
    <div class="actions">
      <a class="cta" href="../#contact">Get SkyCaddy for your course</a>
    </div>
  </section>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</main>
<script>
(function () {
  var v = document.getElementById('fly'), b = document.getElementById('sound'), bar = document.getElementById('bar');
  b.addEventListener('click', function () {
    v.muted = !v.muted;
    if (!v.muted) { v.volume = 1; v.play().catch(function () {}); }
    b.setAttribute('aria-pressed', v.muted ? 'false' : 'true');
    b.innerHTML = v.muted ? '&#128264; Sound on' : '&#128263; Mute';
  });
  v.addEventListener('timeupdate', function () { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100).toFixed(2) + '%'; });
  v.play().catch(function () {});
})();
</script>
</body>
</html>
